<style>
:root{
  --noite:#080812;--noite-2:#0f1030;
  --royal:#363e9b;--royal-claro:#5560d8;
  --ouro:#ffc93c;--ouro-escuro:#e09b12;
  --verde:#1fae5b;--verde-escuro:#168a47;
  --texto:#eceefe;--texto-suave:#a9acd6;
  --linha:rgba(140,150,255,.18);
  --f:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom));
  background:
    radial-gradient(600px 320px at 50% -8%,rgba(85,96,216,.5),transparent 65%),
    radial-gradient(520px 300px at 50% 115%,rgba(255,201,60,.18),transparent 65%),
    var(--noite);
  color:var(--texto);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:clip;
}
.card{
  width:100%;max-width:420px;text-align:center;
  padding:40px 24px 32px;border-radius:24px;
  background:linear-gradient(180deg,rgba(54,62,155,.35),rgba(15,16,48,.85));
  box-shadow:0 0 0 1px var(--linha),0 30px 60px -20px rgba(0,0,0,.6);
  animation:entra .6s cubic-bezier(.2,.8,.2,1) both;
}
/* Anel de progresso */
.anel{position:relative;width:132px;height:132px;margin:0 auto 28px}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel .trilho{stroke:rgba(140,150,255,.18)}
.anel .prog{stroke:url(#g);stroke-linecap:round;stroke-dasharray:339.3;stroke-dashoffset:339.3}
.anel .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-weight:900;font-size:44px;color:var(--ouro);letter-spacing:-.02em;
}
.anel .ok{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.6);transition:.35s}
.feito .anel .num{opacity:0;transition:.2s}
.feito .anel .ok{opacity:1;transform:scale(1)}

.selo{
  display:inline-flex;align-items:center;gap:8px;margin-bottom:14px;
  padding:7px 14px;border-radius:999px;background:rgba(31,174,91,.14);
  color:#5fe39a;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
}
.selo i{width:8px;height:8px;border-radius:50%;background:var(--verde);box-shadow:0 0 0 0 rgba(31,174,91,.7);animation:ping 1.6s infinite}
h1{margin:0 0 10px;font-weight:900;font-size:clamp(24px,7vw,30px);line-height:1.15;text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--ouro)}
p{margin:0 0 26px;color:var(--texto-suave);font-size:15px;line-height:1.55;font-weight:500}

.etapas{list-style:none;margin:0;padding:0;text-align:left;display:grid;gap:10px}
.etapas li{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  background:rgba(8,8,18,.45);box-shadow:0 0 0 1px var(--linha);
  font-size:14px;font-weight:600;color:var(--texto-suave);transition:color .3s,box-shadow .3s;
}
.etapas li b{
  flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 2px rgba(140,150,255,.35);transition:.3s;
}
.etapas li.ativa{color:var(--texto)}
.etapas li.ativa b{box-shadow:inset 0 0 0 2px var(--ouro);border-top:2px solid transparent;animation:gira .8s linear infinite}
.etapas li.ok{color:var(--texto);box-shadow:0 0 0 1px rgba(31,174,91,.4)}
.etapas li.ok b{background:var(--verde);box-shadow:none;animation:none}
.etapas li.ok b::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2.5px 2.5px;transform:translateY(-1px) rotate(-45deg)}


@keyframes entra{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(31,174,91,0)}100%{box-shadow:0 0 0 0 rgba(31,174,91,0)}}
@keyframes gira{to{transform:rotate(360deg)}}
@media (min-width:768px){.card{padding:48px 40px 36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="card" id="card" aria-live="polite">
  <div class="anel" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc93c"/><stop offset="1" stop-color="#1fae5b"/></linearGradient></defs>
      <circle class="trilho" cx="60" cy="60" r="54" fill="none" stroke-width="8"/>
      <circle class="prog" id="prog" cx="60" cy="60" r="54" fill="none" stroke-width="8"/>
    </svg>
    <div class="num" id="num">3</div>
    <div class="ok"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#1fae5b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  </div>

  <div class="selo"><i></i>Conexão segura</div>
  <h1 id="titulo">Seu acesso está<br><span>sendo liberado</span></h1>
  <p id="sub">Aguarde alguns segundos, você será redirecionado automaticamente.</p>

  <ul class="etapas">
    <li id="e1" class="ativa"><b></b>Verificando conexão</li>
    <li id="e2"><b></b>Validando acesso</li>
    <li id="e3"><b></b>Liberando entrada</li>
  </ul>

</main>

<script>
(function(){
  /* ===== CONFIGURAÇÃO ===== */
  var DESTINO  = "https://100zinhowhatsapp.me"; // URL final
  var SEGUNDOS = 3;                             // tempo até redirecionar
  /* ======================== */

  // Repassa UTMs / parâmetros da URL atual (?utm_source=... etc.) para o destino
  var url = new URL(DESTINO);
  new URLSearchParams(location.search).forEach(function(v,k){ url.searchParams.set(k,v); });
  var final = url.toString();

  var prog = document.getElementById("prog"), num = document.getElementById("num");
  var C = 339.3, t0 = performance.now(), total = SEGUNDOS*1000, foi = false;
  var etapas = [document.getElementById("e1"),document.getElementById("e2"),document.getElementById("e3")];

  function etapa(i){
    etapas.forEach(function(el,j){ el.className = j<i ? "ok" : (j===i ? "ativa" : ""); });
  }
  function ir(){ if(foi) return; foi = true; location.replace(final); }

  function tick(now){
    var p = Math.min((now-t0)/total,1);
    prog.style.strokeDashoffset = C*(1-p);
    num.textContent = Math.max(1, Math.ceil(SEGUNDOS*(1-p)));
    etapa(p<.33 ? 0 : p<.7 ? 1 : p<1 ? 2 : 3);
    if(p<1){ requestAnimationFrame(tick); return; }
    document.getElementById("card").classList.add("feito");
    document.getElementById("titulo").innerHTML = 'Acesso<br><span>liberado!</span>';
    document.getElementById("sub").textContent = "Redirecionando você agora…";
    setTimeout(ir, 300);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
